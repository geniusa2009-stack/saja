name: SAJA Integration QA

on:
  pull_request:
    branches:
      - release/integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run full project checks
        run: npm run check
      - name: Syntax-check integration browser tests
        run: |
          node --check e2e/lib.mjs
          node --check e2e/experience.mjs

  audience-browser:
    name: Audience journeys / RTL / mobile / screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system requirements
        run: npx playwright-core install --with-deps chromium
      - name: Run mobile audience journeys
        run: |
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath())")"
          export CHROME_PATH
          npm run e2e:audiences
      - name: Upload bilingual UI screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saja-audience-ui
          path: e2e/screenshots/experience-*.png
          if-no-files-found: ignore
          retention-days: 7
